{t:'Introduction',e:'🤷',en:'Many people {wish|wish} they could speak another language, but before they even begin, they {talkout|talk themselves out of it}. These {doubt|doubts} often come from {myth|myths} about how language learning works, and knowing the truth might change the way you see your own abilities.',zh:'許多人希望自己能說另一種語言，但在開始之前就先說服自己放棄了。這些疑慮常源於對語言學習方式的迷思，而了解真相，或許會改變你看待自己能力的方式。',tip:'💡 第一段為「引言」：點出主題——人們因迷思而自我設限。學測主旨題常考這類「現象＋原因」。'},
{t:'Myth 1',q:'“You have to {startyoung|start young} to become {fluent|fluent}.”',e:'🧒',en:'Age is {lessof|less of a problem} than most people think. While young children {pickup|pick up} {accent|accents} more easily, adults also have {advantage|advantages} such as stronger reading skills and a better ability to focus on study goals. Speaking a language well does not require a young age—it requires regular practice and the right approach.',zh:'年齡的問題沒有多數人想的那麼大。雖然幼童較容易學會口音，成人也有優勢，例如更強的閱讀能力和更能專注於學習目標。把語言說好不需要年紀小，而是需要規律練習和正確的方法。',tip:'💡 注意 While 在此表「讓步（雖然）」；dash（—）後是補充說明。第二題答案要點：regular → 副詞 regularly。'},
{t:'Myth 2',q:'“You need to live abroad to truly learn a language.”',e:'🏠',en:'{what|What matters} is how much time you spend with your target language, not where you live. {thanks|Thanks to} {app|apps}, language websites, and online {tutor|tutors}, you can study a language without leaving home. Watching TV shows, reading posts, or chatting with native speakers online all count as great practice. Where you live does not decide how well you can learn.',zh:'重要的是你花多少時間接觸目標語言，而不是你住在哪裡。多虧有 App、語言網站和線上家教，你不必離家就能學語言。看電視節目、讀貼文或在線上和母語人士聊天，都算是很棒的練習。你住在哪裡並不能決定你能學得多好。',tip:'💡 what matters is… 為名詞子句作主詞，動詞用單數。not A but B 的反向寫法：B, not A。'},
{t:'Myth 3',q:'“Some people are just {born|born with a talent} for languages.”',e:'🧬',en:'The most important {factor|factor} is how often you practice and {whether|whether} you are using helpful study {method|methods}. Think about it this way: About half of the world’s {population|population} speaks more than one language, which shows that knowing two or more languages is normal. Anyone can do it with enough time and effort.',zh:'最重要的因素是你多常練習，以及你是否使用有效的學習方法。換個角度想：全世界約有一半的人口會說不只一種語言，這顯示會兩種以上語言是很正常的。只要有足夠的時間和努力，任何人都做得到。',tip:'💡 which shows that… 的 which 指前面整句話（非限定用法）。about half of … 以分數說明比例。'},
{t:'Myth 4',q:'“You have to speak perfectly before starting a conversation.”',e:'💬',en:'Waiting until you are perfect is only going to slow your progress. Mistakes are a normal part of learning, and most people are {patient|patient} and kind when someone is trying. In fact, speaking {early|early on} is one of the best ways to improve. You will learn much more from real conversations than from studying alone.',zh:'等到完美才開口，只會拖慢你的進步。犯錯是學習的正常部分，而且當有人努力嘗試時，大多數人都很有耐心且友善。事實上，及早開口說是最好的進步方式之一。你從真實對話中學到的，會比獨自讀書多得多。',tip:'💡 much more 的 much 強調比較級。Waiting until… 是動名詞片語作主詞。In fact 引出更強的論點。'},
